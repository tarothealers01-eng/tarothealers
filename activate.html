<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Email Notifications — TarotHealers</title>
  <style>
    body {
      background: #0d0f18;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(22, 27, 46, 0.95);
      border: 1px solid rgba(200, 169, 126, 0.3);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      color: #c8a97e;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: linear-gradient(135deg, #c8a97e, #e2cb9f);
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .note {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✦ Activate FormSubmit ✦</h1>
    <p>
      Click the button below to submit a one-time activation request to FormSubmit. FormSubmit will display a quick verification captcha, and then send the activation link to <strong>tarothealers01@gmail.com</strong>.
    </p>

    <form action="https://formsubmit.co/tarothealers01@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="TarotHealers Initial Form Activation">
      <input type="hidden" name="name" value="TarotHealers Activation">
      <input type="hidden" name="email" value="tarothealers01@gmail.com">
      <input type="hidden" name="message" value="One-time activation request for TarotHealers email notifications.">
      <button type="submit" class="btn">✦ Click To Activate FormSubmit ✦</button>
    </form>

    <div class="note">
      Recipient: tarothealers01@gmail.com · TarotHealers System
    </div>
  </div>
</body>
</html>
